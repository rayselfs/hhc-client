name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Build
        env:
          VITE_ONEDRIVE_CLIENT_ID: ${{ vars.VITE_ONEDRIVE_CLIENT_ID }}
          VITE_BIBLE_API_HOST: ${{ vars.VITE_BIBLE_API_HOST }}
          VITE_BIBLE_API_V1_PREFIX: ${{ vars.VITE_BIBLE_API_V1_PREFIX }}
          VITE_BIBLE_API_V2_PREFIX: ${{ vars.VITE_BIBLE_API_V2_PREFIX }}
        run: npm run build

  prepare:
    needs: quality-gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Validate release version
        id: get_version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
            if [[ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]]; then
              echo "Tag version ${TAG_VERSION} does not match package version ${PACKAGE_VERSION}"
              exit 1
            fi
          fi
          echo "version=${PACKAGE_VERSION}" >> "${GITHUB_OUTPUT}"

  package:
    needs: [quality-gates, prepare]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac
            artifact: macos
            smoke_executable: dist/mac-arm64/LibrePresenter.app/Contents/MacOS/LibrePresenter
          - os: windows-2025
            target: --win
            artifact: windows
            smoke_executable: dist/win-unpacked/libre-presenter.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download macOS video engine runtime
        if: runner.os == 'macOS'
        shell: bash
        env:
          VLC_URL: ${{ vars.VIDEO_ENGINE_VLC_DARWIN_ARM64_URL }}
          VLC_SHA256: ${{ vars.VIDEO_ENGINE_VLC_DARWIN_ARM64_SHA256 }}
          FFMPEG_URL: ${{ vars.VIDEO_ENGINE_FFMPEG_DARWIN_ARM64_URL }}
          FFMPEG_SHA256: ${{ vars.VIDEO_ENGINE_FFMPEG_DARWIN_ARM64_SHA256 }}
        run: |
          node scripts/download-video-engine-runtime.mjs --component=vlc --platform=darwin --arch=arm64 --url="${VLC_URL}" --sha256="${VLC_SHA256}"
          node scripts/download-video-engine-runtime.mjs --component=ffmpeg --platform=darwin --arch=arm64 --url="${FFMPEG_URL}" --sha256="${FFMPEG_SHA256}"

      - name: Download Windows video engine runtime
        if: runner.os == 'Windows'
        shell: bash
        env:
          VLC_URL: ${{ vars.VIDEO_ENGINE_VLC_WIN32_X64_URL }}
          VLC_SHA256: ${{ vars.VIDEO_ENGINE_VLC_WIN32_X64_SHA256 }}
          FFMPEG_URL: ${{ vars.VIDEO_ENGINE_FFMPEG_WIN32_X64_URL }}
          FFMPEG_SHA256: ${{ vars.VIDEO_ENGINE_FFMPEG_WIN32_X64_SHA256 }}
        run: |
          node scripts/download-video-engine-runtime.mjs --component=vlc --platform=win32 --arch=x64 --url="${VLC_URL}" --sha256="${VLC_SHA256}"
          node scripts/download-video-engine-runtime.mjs --component=ffmpeg --platform=win32 --arch=x64 --url="${FFMPEG_URL}" --sha256="${FFMPEG_SHA256}"

      - name: Prepare video engine runtime
        run: npm run prepare:video-engine:strict

      - name: Build unsigned desktop package
        env:
          VITE_ONEDRIVE_CLIENT_ID: ${{ vars.VITE_ONEDRIVE_CLIENT_ID }}
          VITE_BIBLE_API_HOST: ${{ vars.VITE_BIBLE_API_HOST }}
          VITE_BIBLE_API_V1_PREFIX: ${{ vars.VITE_BIBLE_API_V1_PREFIX }}
          VITE_BIBLE_API_V2_PREFIX: ${{ vars.VITE_BIBLE_API_V2_PREFIX }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run package:desktop -- ${{ matrix.target }} --publish never

      - name: Verify packaged runtime and notices
        run: npm run check:packaged-runtime

      - name: Packaged projection smoke
        env:
          PACKAGED_APP_PATH: ${{ matrix.smoke_executable }}
        run: npm run test:e2e:packaged

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: libre-presenter-${{ matrix.artifact }}-${{ needs.prepare.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [quality-gates, prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" release-artifacts/* --generate-notes --verify-tag
